services:
  db:
    image: postgres:16-alpine
    container_name: shikshamesh-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: shikshamesh
      POSTGRES_USER: shikshamesh
      POSTGRES_PASSWORD: shikshamesh_dev_password

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - shikshamesh_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U shikshamesh -d shikshamesh"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  qdrant:
    image: qdrant/qdrant:latest
    container_name: shikshamesh-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    environment:
      QDRANT__SERVICE__API_KEY: shikshamesh_dev_qdrant_key

    volumes:
      - shikshamesh_qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  shikshamesh_postgres_data:
  shikshamesh_qdrant_data: